<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<script>

function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أسعار الذهب - شركه الصائغ المعروف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root{--bg:#0f2a24;--panel:#16382f;--line:#2c5546;--gold:#e0b95c;--gold2:#f3d995;--ivory:#f4ecd6;--muted:#a9bfb3;--warn:#ff8a7a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ivory);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;overflow-x:hidden}
.wrap{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 12px calc(8px + env(safe-area-inset-bottom,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px}
.logo-img{height:118px;width:auto;max-width:42%;object-fit:contain;flex-shrink:0}
.brand{direction:ltr;text-align:left;line-height:1.2;min-width:0}
.brand b{display:block;font-size:2.55rem;line-height:1.05;margin-bottom:2px;color:var(--gold2);font-weight:800;direction:rtl;text-align:left;white-space:nowrap}
.insta{color:#f09433;font-weight:700;font-size:.9rem;white-space:nowrap}
.insta i{color:#dc2743;margin-inline-end:4px}

.hero{background:linear-gradient(160deg,#1c4a3d,#123228);border:1px solid var(--gold);border-radius:16px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero small{display:block;color:var(--muted);font-size:.72rem}
.big{font-size:2rem;font-weight:800;line-height:1.1;color:var(--gold2);direction:ltr;font-variant-numeric:tabular-nums}
.big span{font-size:.8rem;font-weight:600;color:var(--gold);margin-inline-start:4px}
.ounce{background:var(--panel);border:1px solid var(--gold);padding:4px 10px;border-radius:12px;font-size:.8rem;color:var(--gold2);font-weight:600;text-align:center;line-height:1.3}

h2{margin:0;text-align:center;font-size:1rem;color:var(--gold);font-weight:800}

/* two pages (swipe / arrows) */
.carousel{touch-action:pan-y;flex:none;height:calc(100dvh - 300px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:330px;overflow:hidden;transition:height .5s cubic-bezier(.22,.8,.26,1)}
.carousel.short{height:min(378px,calc(100dvh - 360px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));min-height:290px}
.inner{direction:ltr;display:flex;height:100%;transition:transform .5s cubic-bezier(.22,.8,.26,1);will-change:transform;transform:translate3d(0,0,0)}
.inner.drag{transition:none}
.slide{direction:rtl;width:100%;flex-shrink:0;height:100%;padding:0 2px}
.card{height:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.head{display:grid;grid-template-columns:1fr 1fr 1fr;padding:7px 10px;font-size:.78rem;font-weight:800;color:var(--gold2);background:rgba(0,0,0,.25);border-bottom:1px solid var(--gold);text-align:center}
.rows{flex:1;display:flex;flex-direction:column;justify-content:space-around;min-height:0}
.rate-row{font-weight:800;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;text-align:center;padding:4px 10px;border-bottom:1px solid rgba(255,255,255,.07);font-size:.95rem;flex:1}
.rate-row:last-child{border-bottom:0}
.rate-row .k{font-weight:800;color:var(--gold)}
.rate-row .u{color:var(--ivory);font-size:.95rem;font-weight:800}
.rate-row .p{font-weight:800;color:var(--gold2);font-size:1.05rem;font-variant-numeric:tabular-nums;direction:ltr}
#karatRows .rate-row{font-size:1.1rem}
#karatRows .rate-row .p{font-size:1.25rem}

.boxes{position:relative;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;align-content:center;gap:6px;padding:10px;border-radius:20px;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,#1d4a3d 0%,#133129 70%)}
.box{background:linear-gradient(160deg,#173d33,#0f2a24);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:0;padding:8px 6px;text-align:center}
.box.top{justify-content:flex-start;padding-top:12px}
.box.bot{justify-content:flex-end;padding-bottom:12px}
.box .bk{font-size:1.5rem;font-weight:800;color:var(--gold);line-height:1.1}
.box .bu{font-size:.75rem;color:var(--muted);line-height:1.2}
.box .bp{font-size:1.15rem;font-weight:800;color:var(--ivory);font-variant-numeric:tabular-nums;direction:ltr;line-height:1.2}
.box .bp small{font-size:.65rem;font-weight:600;color:var(--gold);margin-inline-start:3px}
.box.hl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;height:36.5%;z-index:2;
  justify-content:center;gap:2px;border:2px solid var(--gold2);
  background:linear-gradient(160deg,#f6e0a0,#d6a937 60%,#b88a22);
  box-shadow:0 14px 28px rgba(0,0,0,.65),0 0 0 4px rgba(224,185,92,.25)}
.box.hl .bk{font-size:2rem;color:#2a1f05}
.box.hl .bu{font-size:.78rem;color:#4a3a10;font-weight:600}
.box.hl .bp{font-size:1.4rem;color:#1b1403}
.box.hl .bp small{color:#4a3a10}
.dots{display:flex;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--gold)}

.info{text-align:center;line-height:1.35}
#time{margin:0;color:var(--muted);font-size:.75rem}
#status{margin:0;color:var(--warn);font-size:.75rem;font-weight:600}
.note{color:var(--warn);font-weight:700;font-size:.75rem;margin:2px 0 0}
.who{text-align:center;color:var(--gold2);font-weight:600;font-size:.8rem}
.who a{color:var(--gold2);text-decoration:none;font-weight:800;direction:ltr;display:inline-block}

.controls{margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px}
.arrow{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:1.3rem;cursor:pointer;border:1px solid var(--line);border-radius:50%;background:var(--panel)}
.refresh{flex:1;max-width:210px;border:0;border-radius:30px;padding:11px;font:800 .9rem 'Cairo',sans-serif;color:#fff;background:linear-gradient(90deg,#25D366,#128C7E);cursor:pointer}
.refresh:disabled{opacity:.7}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <img src="https://i.ibb.co/Gvb1HSWh/1775778278926.png" alt="Logo" class="logo-img">
    <div class="brand"><b>الصائغ<br>المعروف</b><span class="insta"><i class="fab fa-instagram"></i>@alsaighalmarouf</span></div>
  </div>

  <div class="ounce" id="ounceUSD">سعر الأونصة: ...</div>

  <h2 id="mainHeading">أسعار الذهب مباشر</h2>

  <div class="carousel short" id="swipeArea">
    <div class="inner" id="carouselInner">
      <div class="slide"><div class="boxes" id="karatRows"></div></div>
      <div class="slide"><div class="card">
        <div class="head"><span>الوحدة / Unit</span><span>عيار / Karat</span><span>السعر / OMR</span></div>
        <div class="rows" id="bullionRows"></div>
      </div></div>
    </div>
  </div>

  <div class="dots"><span class="dot on" id="d0"></span><span class="dot" id="d1"></span></div>

  <div class="info">
    <p id="time">--</p>
    <p id="status"></p>
    <p class="note">ملاحظه : اسعار الذهب متغيره</p>
    <div class="who">92480599 | أخوكم تمجيد الصائغ</div>
  </div>

  <div class="controls">
    <div class="arrow" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></div>
    <button class="refresh" id="refreshBtn" onclick="loadPrices()">REFRESH PRICES</button>
    <div class="arrow" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = x => x.toFixed(3);
let cur = 0;
const inner = $("carouselInner");
const area = $("swipeArea");

function setPos(extra){
  inner.style.transform = `translate3d(calc(${-cur * 100}% + ${extra}px),0,0)`;
}
function go(n){
  cur = n;
  setPos(0);
  area.classList.toggle("short", cur === 0);
  $("mainHeading").innerText = cur === 0 ? "أسعار الذهب مباشر" : "أسعار سبائك الذهب";
  $("d0").classList.toggle("on", cur === 0);
  $("d1").classList.toggle("on", cur === 1);
}
function moveSlide(dir){ go((cur + dir + 2) % 2); }

// swipe: the page follows the finger, then snaps smoothly
let sx = 0, sy = 0, st = 0, dx = 0, lock = null;
area.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); dx = 0; lock = null;
}, {passive:true});
area.addEventListener('touchmove', e => {
  const mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
  if (lock === null && (Math.abs(mx) > 6 || Math.abs(my) > 6)) {
    lock = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    if (lock === 'x') inner.classList.add('drag');
  }
  if (lock !== 'x') return;
  dx = mx;
  const out = (cur === 0 && dx > 0) || (cur === 1 && dx < 0);   // no page beyond the ends
  setPos(out ? dx * 0.25 : dx);
}, {passive:true});
function endDrag(){
  if (lock !== 'x') return;
  inner.classList.remove('drag');
  const th = Math.min(70, area.offsetWidth * 0.2);
  const quick = Date.now() - st < 250 && Math.abs(dx) > 30;
  if (cur === 0 && dx < 0 && (Math.abs(dx) > th || quick)) go(1);
  else if (cur === 1 && dx > 0 && (Math.abs(dx) > th || quick)) go(0);
  else go(cur);
  lock = null;
}
area.addEventListener('touchend', endDrag, {passive:true});
area.addEventListener('touchcancel', endDrag, {passive:true});

async function getJSON(url, headers){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try{
    const r = await fetch(url, {cache:"no-store", signal:ctrl.signal, headers: headers || {}});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function fetchOunce(){
  try{
    const d = await getJSON("https://api.gold-api.com/price/XAU");
    if(d && d.price) return d.price;
  }catch(e){ console.error(e); }
  // backup 1: goldapi.io (tries each key until one works)
  for (const key of GOLDAPI_KEYS) {
    try{
      const d = await getJSON("https://www.goldapi.io/api/XAU/USD", {"x-access-token": key, "Content-Type": "application/json"});
      if(d && d.price){ console.log("goldapi.io ok:", key.slice(0,14)); return d.price; }
    }catch(e){ console.error("goldapi.io key failed:", key.slice(0,14), e.message); }
  }
  // backup 2
  const d2 = await getJSON("https://data-asg.goldprice.org/dbXRates/USD");
  return d2.items[0].xauPrice;
}

const row = r => `<div class="rate-row"><span class="u">${r[1]}</span><span class="k">${r[0]}</span><span class="p">${r[2]}</span></div>`;

function render(p){
  $("ounceUSD").innerText = "سعر الأونصة (USD): " + Math.floor(p);
  const p24k = (p * 1.4485 + 25) / 116.64;

  const kRows = [["24K","1 جرام",fmt(p24k)],["22K","1 جرام",fmt(p24k*0.920)],["21K","1 جرام",fmt(p24k*0.879)],["18K","1 جرام",fmt(p24k*0.755)],["21K","1 تولة",fmt(p24k*0.879*11.664)]];
  const bx = (r,cls) => `<div class="box ${cls}"><div class="bk">${r[0]}</div><div class="bu">${r[1]}</div><div class="bp">${r[2]}<small>OMR</small></div></div>`;
  $("karatRows").innerHTML =
    bx(kRows[0],"top") + bx(kRows[1],"top") + bx(kRows[3],"bot") + bx(kRows[4],"bot") + bx(kRows[2],"hl");

  const bRows = [["24K","1 جرام",fmt(p24k+4.5)],["24K","2.5 جرام",fmt(p24k*2.5+12)],["24K","5 جرام",fmt(p24k*5+15)],["24K","10 جرام",fmt(p24k*10+15)],["24K","1 تولة",fmt(p24k*11.664+15)],["24K","20 جرام",fmt(p24k*20+20)],["24K","50 جرام",fmt(p24k*50+25)],["24K","100 جرام",fmt(p24k*100+32)],["24K","116.64 جرام",fmt(p24k*116.64)]];
  $("bullionRows").innerHTML = bRows.map(row).join("");
}

async function loadPrices(){
  const btn = $("refreshBtn");
  btn.disabled = true; btn.innerText = "REFRESHING...";
  $("status").innerText = "";
  try{
    const p = await fetchOunce();
    render(p);
    try{ localStorage.setItem("lastP", String(p)); }catch(e){}
    $("time").innerText = "التحديث: " + new Date().toLocaleString('en-US',{month:'short',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
  }catch(e){
    console.error(e);
    let last = null;
    try{ last = parseFloat(localStorage.getItem("lastP")); }catch(e2){}
    if(last){ render(last); $("status").innerText = "تعذر التحديث - آخر سعر محفوظ"; }
    else { $("status").innerText = "تعذر تحميل الأسعار - اضغط تحديث"; }
  }
  btn.disabled = false; btn.innerText = "REFRESH PRICES";
}
window.onload = loadPrices;
</script>
</body>
</html>
